<style>
  :root{color-scheme:dark;--bg:#111A2B;--card:#18233A;--line:#26354F;--ink:#EEF2F7;--dim:#9AA8BC;--amber:#FBBF24;--amber-2:#EA7A0C}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 20px;
    background:radial-gradient(circle at 50% -10%,rgba(251,191,36,.10),transparent 55%),var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","IBM Plex Sans KR",sans-serif;line-height:1.55;word-break:keep-all}
  .wrap{width:100%;max-width:440px}
  .brand{color:#fff;margin:0 0 28px}
  .brand .logo{display:block;height:58px;width:auto}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  h1{font-size:1.25rem;margin:0 0 6px;letter-spacing:-.01em}
  .sub{color:var(--dim);font-size:.88rem;margin:0 0 22px}
  a.card{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:16px 18px;transition:border-color .15s,transform .15s}
  a.card:hover,a.card:focus-visible{border-color:var(--amber);transform:translateY(-1px)}
  a.card:focus-visible{outline:3px solid rgba(251,191,36,.45);outline-offset:2px}
  a.card.main{background:linear-gradient(135deg,rgba(251,191,36,.14),rgba(234,122,12,.06)),var(--card);border-color:rgba(251,191,36,.45);padding:20px}
  .ico{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:rgba(251,191,36,.14);color:var(--amber);flex:none}
  .ico svg{width:22px;height:22px}
  .txt{flex:1;min-width:0}
  .txt b{display:block;font-size:1rem;margin-bottom:2px}
  .txt span{display:block;font-size:.8rem;color:var(--dim)}
  .go{color:var(--dim);flex:none}
  .label{margin:28px 0 10px;font-size:.75rem;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
  .sites{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sites a.card{padding:14px;min-width:0}
  .sites .txt span{overflow-wrap:anywhere}
  .sites .ico{width:34px;height:34px;border-radius:9px}
  .sites .ico svg{width:18px;height:18px}
  .sites .txt b{font-size:.9rem}
  .foot{margin-top:26px;font-size:.75rem;color:#6E7D93;text-align:center}
  @media (max-width:380px){.sites{grid-template-columns:1fr}}
</style>
</head>
